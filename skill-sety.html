<style>
  :root { --bg: #EEF1F6; --paper: #FFFFFF; --fg: #1C1C1E; --slate: #5A6172; --border: #D5DBE5;
    --cobalt: #3F73B5; --gold: #C9A84C; --red: #B3372E; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171C; --paper: #1C2027; --fg: #E8EBF0; --slate: #A3ABBA;
    --border: #343B47; --cobalt: #8BB4DC; --gold: #D9B964; --red: #EF8A80; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 16px/1.5 Calibri, "Source Sans 3", -apple-system, "Segoe UI", Arial, sans-serif;
    padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  main { width: 100%; max-width: 420px; background: var(--paper); border: 1px solid var(--border); border-top: 4px solid var(--gold);
    border-radius: 10px; padding: 28px 26px; }
  main[hidden] { display: none; }
  .et { font-family: Consolas, "Source Code Pro", Menlo, monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--slate); margin: 0 0 6px; }
  h1 { font-family: Cambria, Georgia, serif; font-size: 28px; line-height: 1.2; color: var(--cobalt); margin: 0 0 10px; }
  p { margin: 0 0 18px; color: var(--slate); font-size: 15px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  input[type=password] { width: 100%; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg); }
  input:focus { outline: 2px solid var(--cobalt); outline-offset: 1px; }
  .rzad { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; font-size: 14px; color: var(--slate); }
  .rzad label { display: inline; font-weight: 400; margin: 0; }
  button { width: 100%; font: inherit; font-weight: 600; font-size: 16px; padding: 11px; border-radius: 8px; border: 0;
    background: var(--cobalt); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .blad { color: var(--red); font-size: 14px; min-height: 1.5em; margin: 10px 0 0; }
</style>

      'document.addEventListener("click",function(ev){var a=ev.target.closest&&ev.target.closest("a[href]");if(!a)return;var h=a.getAttribute("href");' +
